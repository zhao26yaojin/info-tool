services:
  mysql:
    image: mysql:8.0
    container_name: test-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Shanghai
    ports:
      - 3306:3306
    volumes:
      - test-mysql-data:/var/lib/mysql
      - ../db:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - test-network
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: test-nacos
    platform: linux/amd64
    restart: always
    environment:
      MODE: ${NACOS_MODE}
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      JVM_XMS: 256m
      JVM_XMX: 512m
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - 8848:8848
      - 9848:9848
    volumes:
      - test-nacos-data:/home/nacos/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8848/nacos/actuator/health
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - test-network
    depends_on:
      mysql:
        condition: service_healthy
  minio:
    image: bitnamilegacy/minio:2025.7.23
    container_name: test-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET}
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - test-minio-data:/bitnami/minio/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network
  imgproxy:
    image: darthsim/imgproxy:latest
    container_name: test-imgproxy
    restart: always
    environment:
      IMGPROXY_USE_S3: true
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      IMGPROXY_UNSAFE: ${IMGPROXY_UNSAFE}
    ports:
      - 8080:8080
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - test-network
  spring-gateway:
    build:
      context: ../../it-server/it-spring/spring-gateway
      dockerfile: Dockerfile
    container_name: it-spring-gateway
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: test
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - test-network
    ports:
      - 3033:3033
  it-db-service:
    build:
      context: ../../it-server/it-base/db-service
      dockerfile: Dockerfile
    container_name: it-db-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: test
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - test-network
  it-soccer-service:
    build:
      context: ../../it-server/it-fb/soccer-service
      dockerfile: Dockerfile
    container_name: it-soccer-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: test
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - test-network
  it-pc-web:
    build:
      context: ../../it-web/PC
      dockerfile: Dockerfile
    container_name: it-pc-web
    restart: always
    ports:
      - 3030:3030
    depends_on:
      - spring-gateway
    networks:
      - test-network
  it-mobile-web:
    build:
      context: ../../it-web/Mobile
      dockerfile: Dockerfile
    container_name: it-mobile-web
    restart: always
    ports:
      - 3031:3031
    depends_on:
      - spring-gateway
    networks:
      - test-network
networks:
  test-network:
    name: test-network
    driver: bridge
volumes:
  test-mysql-data:
  test-nacos-data:
  test-minio-data:
